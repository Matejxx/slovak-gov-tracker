<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sledovanie vládnych lietadiel SR</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="sidebar">
      <div id="sidebar-header">
        <div id="header-title">
          <span class="header-flag">🇸🇰</span>
          <div>
            <h1>Vládne lietadlá SR</h1>
            <p id="last-update">Načítavam…</p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Sledované lietadlá</div>
        <div id="aircraft-list"></div>
      </div>

      <div class="section">
        <div class="section-title">História letov</div>
        <div id="acf-wrapper">
          <div id="acf-toggle" onclick="toggleAcFilter()">
            <div id="acf-current">
              <div class="acf-toggle-placeholder">✈️</div>
              <span class="acf-toggle-label">Všetky lietadlá</span>
            </div>
            <span class="acf-chevron">▾</span>
          </div>
          <div id="acf-list"></div>
        </div>
        <div id="flights-list"></div>
        <button id="load-more" style="display:none">Načítať ďalšie</button>
      </div>
    </div>

    <div id="map-container">
      <a id="support-bar" href="https://buymeacoffee.com/kamletifico" target="_blank" rel="noopener noreferrer">
        <div class="bmc-logo-wrap">
          <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="Buy Me a Coffee" class="bmc-icon">
        </div>
        <div class="bmc-text">
          <span class="bmc-main">Podporiť sledovanie</span>
          <span class="bmc-sub">buymeacoffee.com/kamletifico</span>
        </div>
      </a>
      <div id="map"></div>

      <div id="flight-panel" class="hidden">
        <button id="close-panel">×</button>
        <div id="flight-panel-body"></div>
      </div>

      <div id="stats-bar">
        <span id="stat-flights"></span>
        <span id="stat-positions"></span>
      </div>
    </div>

  </div>

  <div id="mobile-nav">
    <button class="mob-tab active" id="tab-map" onclick="switchMobileTab('map')">
      <span class="tab-icon">🗺️</span>Mapa
    </button>
    <button class="mob-tab" id="tab-list" onclick="switchMobileTab('list')">
      <span class="tab-icon">✈️</span>Lietadlá
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
